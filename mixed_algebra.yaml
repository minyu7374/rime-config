      - derive/^(.*)-$/$1'jiǎn/
      - derive/-/'/
      - derive/\./'diǎn'/
      - derive/\+/'jiā'/
      - derive/#/'jǐng'/
      - xform/'+/'/
      - xform/^'(.*)$/$1/
      - xform/^(.*)'$/$1/
      - derive/^.+$/\U$0/
