# Rime's custom punctuation and symbols
# encoding: utf-8

# 去除一些不常用的符号候选项
patch:
  punctuator/full_shape:
    ' ' : { commit: '　' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹, ⟨ ]
    '>' : [ 》, 〉, », ›, ⟩ ]
    '/' : [ ／, ÷ ]
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    # '\' : [ 、, ＼ ]
    # '|' : [ ·, ｜, '§', '¦' ]
    '\' : 、
    '|' : ·
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    # '@' : [ ＠, ☯ ]
    # '#' : [ ＃, ⌘ ]
    # '%' : [ ％, '°', '℃' ]
    # '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤', ₩ ]
    '@' : ＠
    '#' : ＃
    '%' : ％
    '$' : ￥
    '^' : { commit: …… }
    '&' : ＆
    # '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '*' : ＊
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    # '=' : [ ＝, 々, 〃 ]
    '=' : ＝
    '[' : [ 「, 【, 〔, ［, 〚, 〘 ]
    ']' : [ 」, 】, 〕, ］, 〛, 〙 ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  punctuator/half_shape:
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹, ⟨, ˂, ˱ ]
    '>' : [ 》, 〉, », ›, ⟩, ˃, ˲ ]
    # '/' : [ 、, ､, '/', ／, ÷ ]
    '/' : ['/', ／, ÷ ]
    '?' : { commit: ？ }
    ';' : { commit: ； }
    ':' : { commit: ： }
    '''' : { pair: [ '‘', '’' ] }
    '"' : { pair: [ '“', '”' ] }
    # '\' : [ 、, '\', ＼ ]
    # '|' : [ ·, ・, '|', ｜, '§', '¦', '‖', ︴ ]
    # '`' : [ '`', ‵, ‶, ‷, ′, ″, ‴, ⁗ ]
    # '~' : [ '~', ～, ˜, ˷, ⸯ, ≈, ≋, ≃, ≅, ≇, ∽, ⋍, ≌, ﹏, ﹋, ﹌, ︴ ]
    '\' : 、
    '|' : ·
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    # '@' : [ '@', ©, ®, ℗ ]
    # '#' : [ '#', № ]
    # '%' : [ '%', ％, '°', '℃', ‰, ‱, ℉, ℅, ℆, ℀, ℁, ⅍ ]
    # '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤', ₩ ]
    '@' : '@'
    '#' : '#'
    '%' : '%'
    '$' : ￥
    '^' : { commit: …… }
    '&' : '&'
    # '*' : [ '*', ＊, ·, ・, ×, ※, ❂, ⁂, ☮, ☯, ☣ ]
    '*' : '*'
    '(' : （
    ')' : ）
    '-' : '-'
    '_' : ——
    '+' : '+'
    # '=' : [ '=', 々, 〃 ]
    '=' : '='
    '[' : [ 「, 【, 〔, ［, 〚, 〘 ]
    ']' : [ 」, 】, 〕, ］, 〛, 〙 ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
