      - derive/12/'twelve'/
      - derive/13/'thirteen'/
      - derive/15/'fifteen'/
      - derive/18/'eighteen'/
      - derive/0/o/
      - derive/0/O/
      - derive/0/'zero'/
      - derive/1/'one'/
      - derive/10/'ten'/
      - derive/2/'to'/
      - derive/2/'two'/
      - derive/3/'three'/
      - derive/4/'for'/
      - derive/4/'four'/
      - derive/5/'five'/
      - derive/6/'six'/
      - derive/7/'seven'/
      - derive/8/'eight'/
      - derive/9/'nine'/
      - derive/10/'shí'/
      - derive/0/'líng'/
      - derive/1/'yī'/
      - derive/2/'èr'/
      - derive/3/'sān'/
