# Rime dictionary
# encoding: utf-8

---
name: terra_pinyin.extended
version: "2025.09.23"
sort: by_weight  #字典初始排序，可選original或by_weight
use_preset_vocabulary: false
max_phrase_length: 7
min_phrase_weight: 100

import_tables:
  - terra_pinyin

  # 万象词库
  - dicts/zi            #字表，包含了所有带拼音的汉字
  - dicts/jichu         #基础词库，2-3字词汇
  - dicts/lianxiang     #联想词库，5字以上词汇，多用于输入前半段第二候选可以出来整段
  - dicts/cuoyin        #错音错字，支持错音和错字输入的兼容，同时供超级注释lua使用会在输入错误音节打出的时候给予提示
  - dicts/duoyin        #兼容词库，是基础词库的扩充，收录了多场景多种读音的词组
  - dicts/shici         #诗词
  - dicts/diming        #地名
  # - dicts/wuzhong       #物种多样性,在线供应：https://github.com/amzxyz/rime_wanxiang/tree/wanxiang/dicts
  # - dicts/renming       #人名,在线供应：https://github.com/amzxyz/rime_wanxiang/tree/wanxiang/dicts
  #- dicts/en           #英文词库
  - dicts/cn&en         #中英文混合词库

  # 字表
  # - dicts/8105

  # fcitx5-pinyin-sougou-baidu(词汇+注音+词频)
