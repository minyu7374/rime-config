# Rime custom schema
# encoding: utf-8

patch:
  schema/dependencies/+:
    - radical_pinyin

  # 載入朙月拼音擴充詞庫
  translator/dictionary: luna_pinyin.extended
  # translator/dictionary: wanxiang
  # translator/enable_correction: true    #拼写纠错
  #-- 万象词库迁移放在最前方: https://github.com/amzxyz/RIME-LMDG/wiki/%E5%B0%86%E4%B8%87%E8%B1%A1%E8%AF%8D%E5%BA%93%E8%BF%81%E7%A7%BB%E5%88%B0%E4%BD%A0%E7%9A%84%E9%A1%B9%E7%9B%AE
  speller/algebra/@before 0: xlit/āáǎàōóǒòēéěèīíǐìūúǔùǖǘǚǜü/aaaaooooeeeeiiiiuuuuvvvvv/
  speller/algebra/@before 1: xform/^ng$/eng/
  speller/algebra/@before 2: xform/ńg|ňg|ǹg/eng/
  speller/algebra/@before 3: xform/ń|ň|ǹ/en/
  speller/algebra/@before 4: xform/ḿ/m/

  #--自定义规则
  speller/algebra/@before 5: xform/^([b-df-hj-np-tv-z])$/$1_/
  speller/algebra/@before 6: derive/^([zcs])h/$1/             # zh, ch, sh => z, c, s
  speller/algebra/@before 7: derive/^([zcs])([^h])/$1h$2/     # z, c, s => zh, ch, sh

  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 英文 ]
    - name: full_shape
      reset: 0
      states: [ 半角, 全角 ]
    - name: simplification
      reset: 1
      states: [ 繁體, 简体 ]
    - name: chinese_english
      reset: 0
      states: [ 翻译关, 翻译开 ]
    - name: ascii_punct
      reset: 0
      states: [ 。，, ．， ]

  engine/translators/+:
    - lua_translator@*shijian              # 农历、日期、节气、节日、时间、周、问候模板等等
    - lua_translator@*super_calculator     # 超级计算器，Lua内查看高级用法

  engine/filters/+:
    - simplifier@chinese_english

  punctuator/import_preset: symbols

  recognizer/patterns/punct: '^/([0-9]0?|[A-Za-z]+)$'
  recognizer/patterns/reverse_lookup: "u[a-z;]*?$"        # 使用reverse_lookup_translator挂载rime-radical-pinyin
  recognizer/patterns/lunar: "^N[0-9]{1,8}"               # N 作为触发前缀，响应 lua_translator@shijian，公历转农历，输入 N20250515 得到「二〇二五年五月十五」
  recognizer/patterns/calculator: "^V.*$"                 # V 作为触发前缀，计算器功能引导

  reverse_lookup:
    dictionary: radical_pinyin
    enable_completion: true
    prefix: "u"
    tips: "〔拆〕"

  #中文转英文
  chinese_english:
    option_name: chinese_english
    opencc_config: chinese_english.json
    tips: char
    comment_format:
      - "xform/-/ /"

  key_binder/bindings/+:
    - {accept: "Control+Shift+5", toggle: chinese_english, when: always}
    - {accept: "Control+Shift+6", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+7", toggle: emoji_suggestion, when: always}
    - {accept: "Control+Shift+percent", toggle: chinese_english, when: always}
    - {accept: "Control+Shift+asciicircum", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+ampersand", toggle: emoji_suggestion, when: always}
    # 兼容eamcs中的按键布局
    - {accept: "Control+exclam", select: .next, when: always}
    - {accept: "Control+at", toggle: ascii_mode, when: always}
    - {accept: "Control+numbersign", toggle: full_shape, when: always}
    - {accept: "Control+dollar", toggle: simplification, when: always}
    - {accept: "Control+percent", toggle: chinese_english, when: always}
    - {accept: "Control+asciicircum", toggle: ascii_punct, when: always}
    - {accept: "Control+ampersand", toggle: emoji_suggestion, when: always}

  key_binder/shijian_keys: ["/"]
  calculator/trigger: "V"

  # easy_en/initial_quality: 0
  easy_en/enable_sentence: false

