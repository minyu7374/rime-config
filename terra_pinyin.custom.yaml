# Rime custom settings
# encoding: utf-8

patch:
  __include: common:/patch_terra_pinyin
  translator/dictionary: terra_pinyin.extended
  # translator/dictionary: wanxiang
  speller/algebra:
    #-- pinyin.yaml定义的模糊音处理加进中间
    __patch:
      - preprocessing_algebra
      - pinyin:/zh_z_bufen
      - pinyin:/hu_f_buhun
      - terra_orig_algebra
      - pinyin:/spelling_correction
      - pinyin:/key_correction

preprocessing_algebra:
  __append:
    #-- 万象词库迁移：https://github.com/amzxyz/RIME-LMDG/wiki/%E5%B0%86%E4%B8%87%E8%B1%A1%E8%AF%8D%E5%BA%93%E8%BF%81%E7%A7%BB%E5%88%B0%E4%BD%A0%E7%9A%84%E9%A1%B9%E7%9B%AE
    - xform/^([a-z]+)$/$1④/
    - xform/^(.*)ā(.*)$/$1a$2①/
    - xform/^(.*)á(.*)$/$1a$2②/
    - xform/^(.*)ǎ(.*)$/$1a$2③/
    - xform/^(.*)à(.*)$/$1a$2④/
    - xform/^(.*)ō(.*)$/$1o$2①/
    - xform/^(.*)ó(.*)$/$1o$2②/
    - xform/^(.*)ǒ(.*)$/$1o$2③/
    - xform/^(.*)ò(.*)$/$1o$2④/
    - xform/^(.*)ē(.*)$/$1e$2①/
    - xform/^(.*)é(.*)$/$1e$2②/
    - xform/^(.*)ě(.*)$/$1e$2③/
    - xform/^(.*)è(.*)$/$1e$2④/
    - xform/^(.*)ī(.*)$/$1i$2①/
    - xform/^(.*)í(.*)$/$1i$2②/
    - xform/^(.*)ǐ(.*)$/$1i$2③/
    - xform/^(.*)ì(.*)$/$1i$2④/
    - xform/^(.*)ū(.*)$/$1u$2①/
    - xform/^(.*)ú(.*)$/$1u$2②/
    - xform/^(.*)ǔ(.*)$/$1u$2③/
    - xform/^(.*)ù(.*)$/$1u$2④/
    - xform/^(.*)ǖ(.*)$/$1v$2①/
    - xform/^(.*)ǘ(.*)$/$1v$2②/
    - xform/^(.*)ǚ(.*)$/$1v$2③/
    - xform/^(.*)ǜ(.*)$/$1v$2④/
    - xform/^(.*)ü(.*)$/$1v$2/  #这里特殊
    - xform/^(.*)ń(.*)$/$1n$2②/
    - xform/^(.*)ň(.*)$/$1n$2③/
    - xform/^(.*)ǹ(.*)$/$1n$2④/
    - xform/ḿ/m②/
    - xlit/①②③④/1234
    - derive/^ng(\d)$/eng$1/
    - xform/^n(\d)/en$1/

    #-- 自定义规则
    - xform/^([b-df-np-tv-z])$/$1_/  # 单独的声母输入（b、t 等）需要补全一个占位符 _，避免和完整音节混淆。

terra_orig_algebra:
  #-- terra_pinyin 原有规则
  __append:
    - xform/^r5$/er5/
    # 省略韻母和聲調
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 省略韻母
    - abbrev/^([a-z])(.+)([0-5])$/$1$3/
    - abbrev/^([zcs]h)(.+)([0-5])$/$1$3/
    - derive/^([nl])ve/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/([dtnlgkhrzcs])un/$1uen/
    - derive/ui/uei/
    - derive/iu/iou/
    - derive/ao/oa/
    - derive/([aeiou])ng/$1gn/
    - derive/([iu])a(o|ng?)/a$1$2/
    # 省略聲調
    - derive/^([a-z]+)[0-5]$/$1/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - 'erase/^.*5$/'
    # 符號標調
    - 'xlit 1234 -/<\'
    - 'derive/^(.*)-$/$1;/'
    - 'derive/^(.*)<$/$1,/'
    - 'derive/^(.*)\\$/$1./'

__patch:
