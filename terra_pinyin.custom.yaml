# Rime custom settings
# encoding: utf-8

patch:
  schema/dependencies/+:
    - radical_pinyin

  translator/dictionary: terra_pinyin.extended
  # translator/dictionary: wanxiang
  # 前向追加，不能用 __patch - pinyin/...
  speller/algebra:
    #-- 万象词库迁移：https://github.com/amzxyz/RIME-LMDG/wiki/%E5%B0%86%E4%B8%87%E8%B1%A1%E8%AF%8D%E5%BA%93%E8%BF%81%E7%A7%BB%E5%88%B0%E4%BD%A0%E7%9A%84%E9%A1%B9%E7%9B%AE
    - xform/^([a-z]+)$/$1④/
    - xform/^(.*)ā(.*)$/$1a$2①/
    - xform/^(.*)á(.*)$/$1a$2②/
    - xform/^(.*)ǎ(.*)$/$1a$2③/
    - xform/^(.*)à(.*)$/$1a$2④/
    - xform/^(.*)ō(.*)$/$1o$2①/
    - xform/^(.*)ó(.*)$/$1o$2②/
    - xform/^(.*)ǒ(.*)$/$1o$2③/
    - xform/^(.*)ò(.*)$/$1o$2④/
    - xform/^(.*)ē(.*)$/$1e$2①/
    - xform/^(.*)é(.*)$/$1e$2②/
    - xform/^(.*)ě(.*)$/$1e$2③/
    - xform/^(.*)è(.*)$/$1e$2④/
    - xform/^(.*)ī(.*)$/$1i$2①/
    - xform/^(.*)í(.*)$/$1i$2②/
    - xform/^(.*)ǐ(.*)$/$1i$2③/
    - xform/^(.*)ì(.*)$/$1i$2④/
    - xform/^(.*)ū(.*)$/$1u$2①/
    - xform/^(.*)ú(.*)$/$1u$2②/
    - xform/^(.*)ǔ(.*)$/$1u$2③/
    - xform/^(.*)ù(.*)$/$1u$2④/
    - xform/^(.*)ǖ(.*)$/$1v$2①/
    - xform/^(.*)ǘ(.*)$/$1v$2②/
    - xform/^(.*)ǚ(.*)$/$1v$2③/
    - xform/^(.*)ǜ(.*)$/$1v$2④/
    - xform/^(.*)ü(.*)$/$1v$2/  #这里特殊
    - xform/^(.*)ń(.*)$/$1n$2②/
    - xform/^(.*)ň(.*)$/$1n$2③/
    - xform/^(.*)ǹ(.*)$/$1n$2④/
    - xform/ḿ/m②/
    - xlit/①②③④/1234
    - derive/^ng(\d)$/eng$1/
    - xform/^n(\d)/en$1/

    #--自定义规则
    - xform/^([b-df-np-z])$/$1_/  # 单独的声母输入需要补全一个占位符 _，避免和完整音节混淆。

    #-- 参考pinyin.yaml里的模糊音处理
    - derive/^([zcs])h/$1/             # zh, ch, sh => z, c, s
    - derive/^([zcs])([^h])/$1h$2/     # z, c, s => zh, ch, sh

    - derive/^hu$/fu/                  # hu => fu
    - derive/^hong$/feng/              # hong => feng
    - derive/^hu([in])$/fe$1/          # hui => fei, hun => fen
    - derive/^hu([ao])/f$1/            # hua => fa, ...

    - derive/^fu$/hu/                  # fu => hu
    - derive/^feng$/hong/              # feng => hong
    - derive/^fe([in])$/hu$1/          # fei => hui, fen => hun
    - derive/^f([ao])/hu$1/            # fa => hua, ...

    #-- terra_pinyin 原有规则
    - xform/^r5$/er5/
    # 省略韻母和聲調
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/
    # 省略韻母
    - abbrev/^([a-z])(.+)([0-5])$/$1$3/
    - abbrev/^([zcs]h)(.+)([0-5])$/$1$3/
    - derive/^([nl])ve/$1ue/
    - derive/^([jqxy])u/$1v/
    - derive/([dtnlgkhrzcs])un/$1uen/
    - derive/ui/uei/
    - derive/iu/iou/
    - derive/ao/oa/
    - derive/([aeiou])ng/$1gn/
    - derive/([iu])a(o|ng?)/a$1$2/
    # 省略聲調
    - derive/^([a-z]+)[0-5]$/$1/
    - derive/([dtngkhrzcs])o(u|ng)$/$1o/
    - derive/ong$/on/
    - 'erase/^.*5$/'
    # 符號標調
    - 'xlit 1234 -/<\'
    - 'derive/^(.*)-$/$1;/'
    - 'derive/^(.*)<$/$1,/'
    - 'derive/^(.*)\\$/$1./'

  switches:
    - name: ascii_mode
      reset: 0
      states: [ 中文, 英文 ]
    - name: full_shape
      reset: 0
      states: [ 半角, 全角 ]
    - name: simplification
      reset: 1
      states: [ 繁體, 简体 ]
    - name: chinese_english
      reset: 0
      states: [ 翻译关, 翻译开 ]
    - name: ascii_punct
      reset: 0
      states: [ 。，, ．， ]

  engine/translators/+:
    - lua_translator@*shijian              # 农历、日期、节气、节日、时间、周、问候模板等等
    - lua_translator@*super_calculator     # 超级计算器，Lua内查看高级用法

  engine/filters/+:
    - simplifier@chinese_english

  punctuator/import_preset: symbols

  recognizer/patterns/punct: '^/([0-9]0?|[A-Za-z]+)$'
  recognizer/patterns/reverse_lookup: "u[a-z;]*?$"        # 使用reverse_lookup_translator挂载rime-radical-pinyin
  recognizer/patterns/lunar: "^N[0-9]{1,8}"               # N 作为触发前缀，响应 lua_translator@shijian，公历转农历，输入 N20250515 得到「二〇二五年五月十五」
  recognizer/patterns/calculator: "^V.*$"                 # V 作为触发前缀，计算器功能引导

  reverse_lookup:
    dictionary: radical_pinyin
    enable_completion: true
    prefix: "u"
    tips: "〔拆〕"

  #中文转英文
  chinese_english:
    option_name: chinese_english
    opencc_config: chinese_english.json
    tips: char
    comment_format:
      - "xform/-/ /"

  key_binder/bindings/+:
    - {accept: "Control+Shift+5", toggle: chinese_english, when: always}
    - {accept: "Control+Shift+6", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+7", toggle: emoji_suggestion, when: always}
    - {accept: "Control+Shift+percent", toggle: chinese_english, when: always}
    - {accept: "Control+Shift+asciicircum", toggle: ascii_punct, when: always}
    - {accept: "Control+Shift+ampersand", toggle: emoji_suggestion, when: always}
    # 兼容eamcs中的按键布局
    - {accept: "Control+exclam", select: .next, when: always}
    - {accept: "Control+at", toggle: ascii_mode, when: always}
    - {accept: "Control+numbersign", toggle: full_shape, when: always}
    - {accept: "Control+dollar", toggle: simplification, when: always}
    - {accept: "Control+percent", toggle: chinese_english, when: always}
    - {accept: "Control+asciicircum", toggle: ascii_punct, when: always}
    - {accept: "Control+ampersand", toggle: emoji_suggestion, when: always}

  key_binder/shijian_keys: ["/"]
  calculator/trigger: "V"

  # easy_en/initial_quality: 0
  easy_en/enable_sentence: false

